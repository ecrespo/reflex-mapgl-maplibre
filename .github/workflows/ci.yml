name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      # Install from uv.lock so lint/test tools match local dev (an unpinned
      # ruff upgrade changed the default rule set and broke CI).
      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check custom_components tests

      - name: Test (pytest)
        run: uv run pytest -q
